<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0e7"><title>Rhythm Walk</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#353c3d;font-family:system-ui,'Noto Sans JP',sans-serif;touch-action:manipulation}main{max-width:780px;margin:auto;text-align:center;padding:22px 14px}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:.12em;margin:15px 0 6px;font-size:clamp(32px,7vw,48px)}header p{font-size:14px;letter-spacing:.13em}.scene{height:min(57vh,490px);min-height:300px;background:linear-gradient(#c6dfd9,#e3e8d8 67%,#ddd3b9 67%);border-radius:24px;position:relative;overflow:hidden;margin-top:22px;cursor:pointer;user-select:none}.sun{position:absolute;top:11%;right:15%;width:65px;height:65px;background:#f8e8b4;border-radius:50%}.path{position:absolute;top:67%;height:33%;width:100%;background:#d5c5a8}.walker{position:absolute;top:46%;width:65px;height:130px;transform:translateX(-50%);transition:opacity 1.2s}.walker.self{left:50%}.walker.ghost{left:75%;opacity:0}.head{position:absolute;top:0;left:19px;width:27px;height:27px;background:#e3aa87;border-radius:50%}.body{position:absolute;top:29px;left:15px;width:35px;height:55px;border-radius:13px 13px 6px 6px;background:#d77f6d}.ghost .body{background:#7d8e91}.legs{position:absolute;top:78px;left:12px;font-size:34px;color:#555;white-space:nowrap}.label{position:absolute;top:117px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap}.step{animation:hop .24s ease-out}@keyframes hop{50%{translate:0 -10px}}.ripple{position:absolute;top:77%;height:8px;width:22px;border:2px solid #a17d63;border-radius:50%;transform:translateX(-50%);animation:fade .55s forwards}.ripple.ghost{border-color:#788d90}@keyframes fade{to{opacity:0;scale:2}}button{border:0;border-radius:30px;background:#485c60;color:white;padding:15px 26px;font-size:17px;cursor:pointer;min-height:52px}#hint{margin:22px 0 12px}.note{font-size:13px;color:#687273;margin-top:22px}

.choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.choice{background:#d8e0db;color:#344a4a;padding:10px 16px;font-size:14px;min-height:44px}.choice.active{background:#485c60;color:white;outline:2px solid #8da9a2;outline-offset:2px}.walker.cat .head{width:36px;height:30px;left:14px;top:40px;border-radius:45%;background:#b18b75}.walker.cat .body{width:44px;height:28px;left:10px;top:70px;border-radius:50%;background:#b18b75}.walker.cat .legs{top:86px;font-size:22px}.walker.cat .head:before,.walker.cat .head:after{content:'';position:absolute;top:-10px;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid #b18b75}.walker.cat .head:before{left:-2px}.walker.cat .head:after{right:-2px}#mute{margin-left:8px;background:#718080;font-size:14px;padding:12px 18px}@media(max-width:360px){#mute{margin:8px 0 0}}
</style></head><body><div id="app"></div><script>function nextGhostBeat(last, index) { const gaps=[690,850,570,1040,740,650,980]; return last+gaps[index%gaps.length]; }
function pulseSize(age) {return Math.max(0,1-age/520);}
function position(t) {return 50+Math.sin(t/8500)*27;}
function visibleGhost(t) {const cycle=t%28000;return cycle>3800&&cycle<23800;}



const app=document.querySelector('#app');
app.innerHTML=`<main><header><h1>Rhythm Walk</h1><p>分からないままでも、一緒に鳴れる。</p></header><div class="choices" role="group" aria-label="歩く存在を選ぶ"><button class="choice active" data-being="shoes">ローファーの少女</button><button class="choice" data-being="cat">猫</button></div><section class="scene" id="scene" aria-label="タップすると歩く音が鳴ります"><div class="sun"></div><div class="path"></div><div id="ghost" class="walker ghost"><span class="head"></span><span class="body"></span><span class="legs">╱ ╲</span><span class="label">杖をつく人</span></div><div id="self" class="walker self"><span class="head"></span><span class="body"></span><span class="legs">╱ ╲</span><span class="label">あなた</span></div><div id="ripples"></div></section><p id="hint">画面をタップ。好きな間隔で歩こう。</p><button id="start">音を鳴らして歩く</button><p class="note">誰かが近づいても、合わせなくていい。</p></main>`;
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{being=b.dataset.being;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#self .label').textContent=being==='cat'?'猫':'あなた';document.querySelector('#self').classList.toggle('cat',being==='cat');}));
const scene=document.querySelector('#scene'),self=document.querySelector('#self'),ghost=document.querySelector('#ghost'),ripples=document.querySelector('#ripples'),start=document.querySelector('#start'),hint=document.querySelector('#hint');
let being='shoes',muted=false;let audio,started=false,origin=0,ghostBeat=0,beatIndex=0,lastSelf=0,lastGhost=0,steps=0;
function sound(kind){if(!audio||muted)return;const now=audio.currentTime;const osc=audio.createOscillator(),gain=audio.createGain(),filter=audio.createBiquadFilter();osc.type=kind==='self'?(being==='cat'?'sine':'triangle'):'sine';osc.frequency.setValueAtTime(kind==='self'?(being==='cat'?420:175):110,now);osc.frequency.exponentialRampToValueAtTime(kind==='self'?(being==='cat'?240:65):55,now+.09);filter.type='lowpass';filter.frequency.value=kind==='self'?620:380;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(kind==='self'?.15:.10,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+.17);osc.connect(filter).connect(gain).connect(audio.destination);osc.start(now);osc.stop(now+.18);}
function step(kind,t){sound(kind);const el=kind==='self'?self:ghost;el.classList.remove('step');void el.offsetWidth;el.classList.add('step');const dot=document.createElement('i');dot.className='ripple '+kind;dot.style.left=el.style.left||'50%';ripples.append(dot);setTimeout(()=>dot.remove(),550);if(kind==='self'){lastSelf=t;steps++;document.querySelector('#hint').textContent=being==='cat'?'小さな足音が、道に残る。':'好きな間隔で歩こう。合わせなくていい。';}else lastGhost=t;}
async function begin(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();}await audio.resume();if(!started){started=true;origin=performance.now();ghostBeat=nextGhostBeat(0,0);start.textContent='もう一歩';hint.textContent='急がなくていい。誰かの足音が聞こえる。';requestAnimationFrame(tick);}step('self',performance.now()-origin);}
start.addEventListener('click',begin);scene.addEventListener('pointerdown',begin);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();begin();}});
function tick(now){if(!started)return;const t=now-origin;self.style.left=position(t)+'%';ghost.style.left=(75-position(t)*.35)+'%';const nearby=visibleGhost(t);ghost.style.opacity=nearby?'1':'0';if(nearby&&t>=ghostBeat){step('ghost',t);ghostBeat=nextGhostBeat(ghostBeat,++beatIndex);}else if(!nearby&&t>=ghostBeat){ghostBeat=nextGhostBeat(t,++beatIndex);}requestAnimationFrame(tick);}

const mute=document.createElement('button');mute.id='mute';mute.textContent='音を消す';mute.setAttribute('aria-pressed','false');start.after(mute);mute.addEventListener('click',()=>{muted=!muted;mute.textContent=muted?'音を戻す':'音を消す';mute.setAttribute('aria-pressed',String(muted));});
</script></body></html>
